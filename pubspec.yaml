name: waqti
description: وقتي — تعلّم قراءة الساعة للأطفال
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
riverpod_annotation: ^2.5.0

  # Navigation
  go_router: ^14.6.2

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Ads
  google_mobile_ads: ^5.1.0

  # Audio
  audioplayers: ^6.1.0

  # UI
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3

  # Utils
  dartz: ^0.10.1
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  in_app_review: ^2.0.9


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.15

  freezed: ^2.4.8
  json_serializable: ^6.8.0

  riverpod_generator: ^2.4.3

  hive_generator: ^2.0.1

  mocktail: ^1.0.4

  flutter_launcher_icons: ^0.14.3
