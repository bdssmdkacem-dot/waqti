name: Build Android

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build + Install + Launch Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Clean
        run: flutter clean

      - name: Get Packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

      # Release signing is required for the APK/AAB validation below.
      # Secrets are available on trusted branch pushes, but are intentionally
      # not used for pull_request runs.
      - name: Setup Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD is missing" && exit 1)

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
storeFile=${{ github.workspace }}/android/app/upload-keystore.jks
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF

          test -s android/key.properties
          echo "Release keystore configured successfully."

      - name: Verify release signing configuration
        if: github.event_name != 'pull_request'
        run: |
          test -s android/app/upload-keystore.jks
          test -s android/key.properties
          grep -q '^storeFile=' android/key.properties
          grep -q '^keyAlias=' android/key.properties
          echo "Signing files are present."

      - name: Build APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --no-shrink

      - name: Validate APK structure and signature
        if: github.event_name != 'pull_request'
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.daryne.waqti'|launchable-activity"

      - name: Install and launch APK on Android Emulator
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell pm path com.daryne.waqti
            adb shell monkey -p com.daryne.waqti 1
            sleep 8
            adb shell dumpsys activity activities | grep -E "com.daryne.waqti|mResumedActivity" || true
            adb logcat -d -t 300 | grep -E "FATAL EXCEPTION|AndroidRuntime|com.daryne.waqti" || true

      - name: Build AppBundle
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release --no-shrink

      - name: Validate AAB exists
        if: github.event_name != 'pull_request'
        run: test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: waqti-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: waqti-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
