name: Patch Smart Review instrumentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[smart-review-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch LessonPage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/features/curriculum/presentation/pages/lesson_page.dart')
          s = p.read_text()
          pattern = r"  void _onAnswer\(bool ok\) \{.*?\n  \}"
          new = '''  void _onAnswer(bool ok) {
            setState(() { answered = true; lastCorrect = ok; results[qi] = ok; if (ok) correct++; });
            final questionKey = 'question:${widget.lesson.id}:$qi';
            final skillKey = 'lesson:${widget.lesson.id}';
            ref.read(progressNotifierProvider.notifier).recordQuestionResult(
              questionKey: questionKey,
              skillKey: skillKey,
              correct: ok,
            );
            if (ok) _sound.correct(); else _sound.wrong();
          }'''
          patched, count = re.subn(pattern, new, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one _onAnswer block, found {count}')
          p.write_text(patched)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/curriculum/presentation/pages/lesson_page.dart
          git diff --cached --quiet && exit 0
          git commit -m 'feat(review): record lesson question outcomes [smart-review-patched]'
          git push
