name: Restore lesson page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[restore-lesson-page]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore lesson_page.dart from known-good commit
        run: |
          git checkout 1dc6e7688a9d71371818ae69ec24fef9a337910e -- lib/features/curriculum/presentation/pages/lesson_page.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/curriculum/presentation/pages/lesson_page.dart
          git commit -m "Restore lesson page after AdMob edit [restore-lesson-page]" || exit 0
          git push
